<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet"  href="styles.css">
    <link rel="icon"  href="images/favicon.png">
</head>
<body>

<div class="modal" id="playerModal">
  <div class="modal-content">
    <h1> 🎮 <span class="green">TIC</span> 
  <span class="white">TAC</span> 
  <span class="pink">TOE</span> </h1> 
  <div class="form"> 
    <label for="player1">Player 1 (X)</label>
     <input type="text" id="player1" placeholder="Enter Player 1 Name">
    <label for="player2">Player 2 (O)</label>
     <input type="text" id="player2" placeholder="Enter Player 2 Name">
  <button id="startBtn">START</button>
</div>
</div>
</div>

<!---Game Container-->
<div class="container hide" id="game-container">
  
  <div class="msg-container hide">
   <p id="msg">Winner</p>
      <button id="new">NEW GAME</button>
  </div>
  <div class="game-area ">

  <h1>
  <span class="green">TIC</span> 
  <span class="white">TAC</span> 
  <span class="pink">TOE</span>
</h1>

  <div class ="game">
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
   <button class="box"></button>
</div>
<div class="btn-cont"><button class="reset">RESET</button></div>
</div>

<div class="modal hide" id="drawModal">
  <div class="draw-modal">
    <p>Game Draw 😐</p>
    <button id="closeModal">OK</button>
  </div>
</div>
</div>

   <script src="script.js"></script>
</body>
</html>
